name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A push that lands while a deploy is running should supersede it, not race it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  worker:
    name: Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `predeploy` regenerates the gitignored CSS data bundles, so the deploy
      # always ships data matching the versions npm just resolved.
      - name: Deploy Worker
        run: npm run deploy --workspace mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploying a server that answers `tools/list` but fails `tools/call` is
      # worse than not deploying, so prove the real endpoint works.
      - name: Smoke test the deployment
        run: node mcp/scripts/smoke.js https://css-sota-mcp.lusrodri.workers.dev/mcp

  landing:
    name: Landing
    runs-on: ubuntu-latest
    environment: production
    # The hero demo calls the Worker, so publish the docs only once the thing
    # they document is actually live.
    needs: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy landing to Pages
        run: npm run deploy --workspace landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
